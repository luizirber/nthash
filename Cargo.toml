[package]
name = "nthash"
version = "0.5.1"
authors = ["Luiz Irber <luiz.irber@gmail.com>"]
description = "ntHash is a rolling hash function for hashing all possible k-mers in a DNA sequence."
repository = "https://github.com/luizirber/nthash"
documentation = "https://docs.rs/nthash"
keywords = ["bioinformatics"]
categories = ["science", "algorithms"]
license = "MIT/Apache-2.0"
readme = 'README.md'
edition = "2021"
rust-version = "1.56.0"

[dependencies]
thiserror = "1.0"

[dev-dependencies]
criterion = "0.3.0"
quickcheck = "1.0.3"
rand = "0.8.5"

[[bench]]
name = "nthash"
harness = false
